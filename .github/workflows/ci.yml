name: Checks

# Runs on every pull request and on pushes to any branch except main.
# main deploys through deploy-cloudflare.yml, which runs the same checks first.
on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle sizes
        # Fails when a file grows more than 10% past scripts/bundle-baseline.json (package F8).
        run: |
          set -o pipefail
          {
            echo "### Bundle sizes (gzipped)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          node scripts/check-bundle-size.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Keep the build for the preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  firestore-rules:
    # Only needed while live rooms run on Firestore (see package R4 of the plan).
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and the emulator tools
        run: |
          npm ci
          npm i --no-save @firebase/rules-unit-testing@6.0.0 firebase-tools@15.34.1

      - name: Check firestore.rules against the emulator
        run: npx firebase emulators:exec --config scripts/firestore-emulator.json --project demo-grammar-casino --only firestore "node scripts/check-firestore-rules.mjs"

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Play a local game and a live room
        run: npm run test:e2e
        env:
          CI: "true"

  preview:
    name: Preview on Cloudflare Pages
    # Only for pull requests from this repository (forks cannot see the deploy secret).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, firestore-rules, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Package R4: the live-room Worker (one Durable Object per room). The Cloudflare token must
      # allow Workers (Account > Workers Scripts > Edit). If it cannot be published, the site still
      # is, and rooms keep using Firestore (the game falls back by itself).
      - name: Deploy the room server
        id: rooms
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f49491d571ea9dcd9e2bda13cdc59c87"
        run: npx wrangler deploy --config room-worker/wrangler.toml

      - name: Say whether the room server was published
        if: always()
        run: |
          if [ "${{ steps.rooms.outcome }}" = "success" ]; then
            echo "Room server published (grammarcasino-rooms)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The room server could not be published. The Cloudflare token probably lacks Account > Workers Scripts > Edit. Live rooms keep using Firestore."
            echo "The room server could not be published: give the Cloudflare token Account > Workers Scripts > Edit. Live rooms keep using Firestore." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy the preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f49491d571ea9dcd9e2bda13cdc59c87"
          BRANCH: ${{ github.head_ref }}
        run: |
          npx wrangler pages deploy dist --project-name grammarcasino --branch "$BRANCH" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.grammarcasino\.pages\.dev' deploy.log | tail -1)
          {
            echo "### Preview"
            echo ""
            echo "Try this pull request on real phones before merging: ${url:-see the deploy log above}"
          } >> "$GITHUB_STEP_SUMMARY"
