name: Deploy to Cloudflare Pages

concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The deploy below runs only if every check in this job passes.
      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Cloudflare Pages (grammarcasino.pages.dev)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f49491d571ea9dcd9e2bda13cdc59c87"
        run: npx wrangler pages deploy dist --project-name grammarcasino --branch main
