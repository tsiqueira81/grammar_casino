<!doctype html><html><head><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const view = new URLSearchParams(location.search).get('view') || 'projector';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(1280, 720); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const key = new THREE.DirectionalLight(0xfff3d1, 1.85); key.position.set(1.5, 7.5, 3.5); scene.add(key);
const rim = new THREE.PointLight(0x38bdf8, 0.9, 12); rim.position.set(-3.5, 2.6, -1.8); scene.add(rim);
const cam = new THREE.PerspectiveCamera(36, 1280/720, 0.1, 60);
if (view === 'projector') { cam.position.set(0, 6.2, 6.6); cam.lookAt(0, 0, 0.25); }
if (view === 'low') { cam.fov = 40; cam.updateProjectionMatrix(); cam.position.set(3.6, 2.0, 6.0); cam.lookAt(0, 0, -0.2); }
if (view === 'wide') { cam.fov = 50; cam.updateProjectionMatrix(); cam.position.set(0, 8.5, 10.5); cam.lookAt(0, 0, 0); }
const loader = new GLTFLoader();
const load = (f) => new Promise((res, rej) => loader.load('/public/models/' + f, g => res(g.scene), undefined, rej));
const [room, table, chips] = await Promise.all([load('room.glb'), load('table.glb'), load('poker_chips.glb')]);
scene.add(room, table);
let i = 0;
chips.traverse(o => { if (/^Chip_\d+$/.test(o.name)) { const c = o.clone(true); c.scale.setScalar(0.32); c.position.set(-0.5 + i * 0.25, 0.03, -0.35); scene.add(c); i++; } });
r.render(scene, cam);
document.title = 'done';
</script></body></html>
